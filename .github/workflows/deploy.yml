name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash <<'ENDSSH'
          set -ex
          cd ${{ secrets.DEPLOY_PATH }}
          git pull origin main
          ./.venv/bin/pip install -e .
          screen -S magic-maze -X quit || true
          TERM=xterm screen -dmS magic-maze ${{ secrets.DEPLOY_PATH }}/.venv/bin/gunicorn --worker-class eventlet -w 1 --chdir ${{ secrets.DEPLOY_PATH }} --bind 0.0.0.0:5001 --error-logfile ${{ secrets.DEPLOY_PATH }}/app.log run:app
          sleep 2
          screen -ls || true
          ps aux | grep -v grep | grep gunicorn || echo "gunicorn NOT running"
          ENDSSH

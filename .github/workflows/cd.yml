name: Flask CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository }}/flask-app:latest
          ghcr.io/${{ github.repository }}/flask-app:${{ github.sha }}

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
          # Log into GHCR on the remote server
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Pull the latest image
          docker pull ghcr.io/${{ github.repository }}/flask-app:latest
          
          # Stop and remove the old container if it exists
          docker stop flask-app-prod || true
          docker rm flask-app-prod || true
          
          # Run the new container
          docker run -d \
            --name flask-app-prod \
            -p 80:5000 \
            --restart always \
            -e FLASK_ENV=production \
            -e SECRET_KEY="${{ secrets.FLASK_SECRET_KEY }}" \
            ghcr.io/${{ github.repository }}/flask-app:latest
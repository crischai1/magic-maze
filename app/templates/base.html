<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Co-Op Maze Heist{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}" />
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Shared SVG glyph library. Hidden — used via <use href="#glyph-…"> from
         the home-page legend and the in-game board. All glyphs are original art
         (no scanned imagery) in the bold flat-silhouette style of the original
         Magic Maze board. fill="currentColor" lets CSS color classes tint each
         glyph per hero color. -->
    <svg aria-hidden="true" focusable="false"
         style="position:absolute;width:0;height:0;overflow:hidden">
        <defs>
            <!-- Original board glyphs (no copyrighted art). -->
            <g id="glyph-item">
                <!-- Treasure chest: lid + body -->
                <path d="M-11 -2 Q-11 -10 0 -10 Q11 -10 11 -2 L11 0 L-11 0 Z"
                      fill="currentColor" opacity="0.25" stroke="currentColor" stroke-width="1.8"/>
                <rect x="-11" y="0" width="22" height="10" rx="1" fill="currentColor" opacity="0.18" stroke="currentColor" stroke-width="1.8"/>
                <rect x="-3" y="-1" width="6" height="6" rx="0.5" fill="currentColor" opacity="0.8"/>
            </g>
            <g id="glyph-exit">
                <!-- Doorway with an arrow exiting -->
                <path d="M-10 12 L-10 -8 Q-10 -12 -6 -12 L6 -12 Q10 -12 10 -8 L10 12"
                      fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M-3 4 L5 4 M2 1 L5 4 L2 7" fill="none" stroke="currentColor" stroke-width="2"/>
            </g>
            <g id="glyph-vortex">
                <path d="M0,-12 A12,12 0 1,1 -0.01,-12 M0,-7 A7,7 0 1,0 0.01,-7 M0,-3 A3,3 0 1,1 0.01,-3"
                      fill="none" stroke="currentColor" stroke-width="2"/>
            </g>
            <g id="glyph-escalator">
                <path d="M-12 8 L-4 8 L-4 -2 L4 -2 L4 -12 L12 -12" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M9 -12 L12 -12 L12 -9" fill="none" stroke="currentColor" stroke-width="2"/>
            </g>
            <!-- Explore door: canonical orientation has the arrow pointing
                 in the +Y direction (downward in SVG screen coords). One glyph
                 serves all 4 edge orientations via rotation. -->
            <g id="glyph-explore-door">
                <polygon points="-9,-7 9,-7 9,2 0,11 -9,2"
                         fill="currentColor" opacity="0.95"
                         stroke="#0a1422" stroke-width="1.5" stroke-linejoin="round"/>
            </g>
            <g id="glyph-sand-timer">
                <path d="M-8 -10 L8 -10 L-8 10 L8 10 Z" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M-8 -10 L8 -10" stroke="currentColor" stroke-width="2"/>
            </g>
            <g id="glyph-crystal">
                <circle cx="0" cy="-2" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
                <path d="M-3 -5 Q0 -8 3 -5" fill="none" stroke="currentColor" stroke-width="1" opacity="0.6"/>
                <ellipse cx="0" cy="9" rx="6" ry="1.5" fill="currentColor" opacity="0.4"/>
            </g>
            <g id="glyph-camera">
                <rect x="-10" y="-6" width="14" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="2"/>
                <circle cx="-3" cy="-1" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/>
                <path d="M4 -3 L10 -6 L10 4 L4 1 Z" fill="currentColor" opacity="0.4" stroke="currentColor" stroke-width="1"/>
            </g>
            <!-- New: Dwarf Passage — orange one-way wall break (ladder/rungs). -->
            <g id="glyph-dwarf-passage">
                <rect x="-11" y="-8" width="2" height="16"
                      fill="currentColor" stroke="#0a1422" stroke-width="0.6"/>
                <rect x="9" y="-8" width="2" height="16"
                      fill="currentColor" stroke="#0a1422" stroke-width="0.6"/>
                <rect x="-9" y="-6" width="18" height="2.2"
                      fill="currentColor" stroke="#0a1422" stroke-width="0.5"/>
                <rect x="-9" y="-1.1" width="18" height="2.2"
                      fill="currentColor" stroke="#0a1422" stroke-width="0.5"/>
                <rect x="-9" y="3.8" width="18" height="2.2"
                      fill="currentColor" stroke="#0a1422" stroke-width="0.5"/>
            </g>
        </defs>
    </svg>
    <header class="site-header">
        <a href="{{ url_for('lobby.index') }}" class="site-title">Co-Op Maze Heist</a>
        <span class="subtitle">A real-time cooperative tile-exploration heist</span>
    </header>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
